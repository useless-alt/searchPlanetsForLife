name: Refresh catalog data

# Обновление каталога и выгрузка в Supabase каждые 3 часа.
# Публикация сайта на GitHub Pages пока не используется: страница собирается
# обычной сборкой (`npm run build`), статический режим готов в
# `apps/web/src/api/staticClient.ts` и `scripts/build-pages.mjs`.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Один прогон за раз: новый не стартует, пока идёт предыдущий.
concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # На чистом runner локальных копий нет: забираем их из Supabase,
      # чтобы конвейер мог использовать fallback (п. 8.2).
      - name: Restore backups from Supabase
        run: node scripts/restore-backups-from-supabase.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Обновление источников и запись копий + слитого снимка.
      # При неполном обновлении скрипт выходит с кодом 1 и ничего не заменяет.
      - name: Refresh catalog
        run: npm run refresh
        env:
          BACKUP_DIR: data/backups
          REFRESH_REQUIRE_SOURCES: nasa,exoplanet_eu,exomercat,gaia,simbad

      # Выгрузка в Supabase: новые снимки заменяют прежние только после
      # успешной загрузки всех строк.
      - name: Upload to Supabase
        run: node scripts/upload-backups-to-supabase.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEEP_VERSIONS: '1'

      - name: Upload merged snapshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-merged
          path: apps/server/data/backups/merged/latest.json
          retention-days: 7
          if-no-files-found: error
